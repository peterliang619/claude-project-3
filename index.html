<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background: #f5f5f5;
            color: #333;
        }

        #cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid #333;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.15s ease-out, border-color 0.2s;
            transform: translate(-50%, -50%);
        }

        #cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #cursor.hover {
            transform: translate(-50%, -50%) scale(1.5);
            border-color: #000;
        }

        #cursor.hover::after {
            background: #000;
        }

        #score {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 60px;
            font-size: 1.2em;
            color: #333;
            pointer-events: none;
            z-index: 100;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.7em;
            opacity: 0.5;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 2em;
            font-weight: 200;
        }

        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            font-weight: 200;
            letter-spacing: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            text-transform: uppercase;
        }

        #result.show {
            opacity: 1;
        }

        #result.win {
            color: #333;
        }

        #result.lose {
            color: #999;
        }

        #result.draw {
            color: #666;
        }
    </style>
</head>
<body>
    <div id="cursor"></div>

    <div id="score">
        <div class="score-item">
            <div class="score-label">You</div>
            <div class="score-value" id="player-score">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">Draw</div>
            <div class="score-value" id="draw-score">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">AI</div>
            <div class="score-value" id="ai-score">0</div>
        </div>
    </div>

    <div id="result"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Custom cursor
        const cursor = document.getElementById('cursor');
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        // Game State
        const gameState = {
            playerScore: 0,
            aiScore: 0,
            drawScore: 0,
            isPlaying: false,
            hoveredObject: null
        };

        // Three.js Setup
        let scene, camera, renderer, raycaster, mouse;
        let playerChoices = {}, aiChoices = {};

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);

            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 14, 20);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.5);
            mainLight.position.set(8, 15, 8);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.left = -15;
            mainLight.shadow.camera.right = 15;
            mainLight.shadow.camera.top = 15;
            mainLight.shadow.camera.bottom = -15;
            scene.add(mainLight);

            // Create table
            createTable();

            // Create player choices
            createPlayerChoices();

            // Create AI choices
            createAIChoices();

            // Create floor
            createFloor();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);

            // Start animation
            animate();
        }

        function createTable() {
            // Simple table top
            const topGeometry = new THREE.BoxGeometry(16, 0.3, 12);
            const topMaterial = new THREE.MeshLambertMaterial({
                color: 0xffffff
            });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = 0;
            top.castShadow = true;
            top.receiveShadow = true;
            scene.add(top);

            // Thin center line
            const lineGeometry = new THREE.BoxGeometry(16, 0.02, 0.02);
            const lineMaterial = new THREE.MeshBasicMaterial({
                color: 0xdddddd
            });
            const line = new THREE.Mesh(lineGeometry, lineMaterial);
            line.position.y = 0.2;
            scene.add(line);
        }

        function createRock(color) {
            const geometry = new THREE.IcosahedronGeometry(0.8, 0);
            const material = new THREE.MeshLambertMaterial({
                color: color,
                flatShading: true
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function createPaper(color) {
            const geometry = new THREE.BoxGeometry(1.4, 0.02, 1.4);
            const material = new THREE.MeshLambertMaterial({
                color: color
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = Math.PI * 0.05;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function createScissors(color) {
            const group = new THREE.Group();

            const bladeGeometry = new THREE.CylinderGeometry(0.08, 0.08, 1.5, 8);
            const bladeMaterial = new THREE.MeshLambertMaterial({
                color: color
            });

            const blade1 = new THREE.Mesh(bladeGeometry, bladeMaterial);
            blade1.position.set(-0.3, 0.5, 0);
            blade1.rotation.z = -0.3;
            blade1.castShadow = true;

            const blade2 = new THREE.Mesh(bladeGeometry, bladeMaterial);
            blade2.position.set(0.3, 0.5, 0);
            blade2.rotation.z = 0.3;
            blade2.castShadow = true;

            group.add(blade1);
            group.add(blade2);

            return group;
        }

        function createPlayerChoices() {
            const playerColor = 0x333333;
            const spacing = 4.5;
            const yPos = 0.8;
            const zPos = 4.5;

            // Rock
            const rock = createRock(playerColor);
            rock.position.set(-spacing, yPos, zPos);
            rock.userData = { type: 'rock', side: 'player', clickable: true };
            scene.add(rock);
            playerChoices.rock = rock;

            // Paper
            const paper = createPaper(playerColor);
            paper.position.set(0, yPos, zPos);
            paper.userData = { type: 'paper', side: 'player', clickable: true };
            scene.add(paper);
            playerChoices.paper = paper;

            // Scissors
            const scissors = createScissors(playerColor);
            scissors.position.set(spacing, yPos, zPos);
            scissors.userData = { type: 'scissors', side: 'player', clickable: true };
            scene.add(scissors);
            playerChoices.scissors = scissors;
        }

        function createAIChoices() {
            const aiColor = 0x999999;
            const spacing = 4.5;
            const yPos = 0.8;
            const zPos = -4.5;

            // Rock
            const rock = createRock(aiColor);
            rock.position.set(-spacing, yPos, zPos);
            rock.scale.set(0.8, 0.8, 0.8);
            rock.userData = { type: 'rock', side: 'ai' };
            rock.visible = false;
            scene.add(rock);
            aiChoices.rock = rock;

            // Paper
            const paper = createPaper(aiColor);
            paper.position.set(0, yPos, zPos);
            paper.scale.set(0.8, 0.8, 0.8);
            paper.userData = { type: 'paper', side: 'ai' };
            paper.visible = false;
            scene.add(paper);
            aiChoices.paper = paper;

            // Scissors
            const scissors = createScissors(aiColor);
            scissors.position.set(spacing, yPos, zPos);
            scissors.scale.set(0.8, 0.8, 0.8);
            scissors.userData = { type: 'scissors', side: 'ai' };
            scissors.visible = false;
            scene.add(scissors);
            aiChoices.scissors = scissors;
        }

        function createFloor() {
            const floorGeometry = new THREE.PlaneGeometry(100, 100);
            const floorMaterial = new THREE.MeshLambertMaterial({
                color: 0xf5f5f5
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Check for hover
            raycaster.setFromCamera(mouse, camera);
            const clickableObjects = Object.values(playerChoices);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            // Reset previous hover
            if (gameState.hoveredObject && !gameState.isPlaying) {
                resetObjectScale(gameState.hoveredObject);
                gameState.hoveredObject.traverse(child => {
                    if (child.material) {
                        child.material.color.setHex(0x333333);
                    }
                });
                gameState.hoveredObject = null;
            }

            if (intersects.length > 0 && !gameState.isPlaying) {
                let object = intersects[0].object;
                while (object.parent && !object.userData.clickable) {
                    object = object.parent;
                }

                if (object.userData.clickable) {
                    gameState.hoveredObject = object;
                    object.scale.set(1.15, 1.15, 1.15);
                    object.traverse(child => {
                        if (child.material) {
                            child.material.color.setHex(0x000000);
                        }
                    });
                    cursor.classList.add('hover');
                    return;
                }
            }

            cursor.classList.remove('hover');
        }

        function onClick(event) {
            if (gameState.isPlaying) return;

            raycaster.setFromCamera(mouse, camera);
            const clickableObjects = Object.values(playerChoices);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                let object = intersects[0].object;
                while (object.parent && !object.userData.clickable) {
                    object = object.parent;
                }

                if (object.userData.clickable) {
                    playRound(object.userData.type);
                }
            }
        }

        function playRound(playerChoice) {
            gameState.isPlaying = true;

            // Highlight player choice
            playerChoices[playerChoice].traverse(child => {
                if (child.material) {
                    child.material.color.setHex(0x000000);
                }
            });

            // Dim other choices
            Object.entries(playerChoices).forEach(([type, obj]) => {
                if (type !== playerChoice) {
                    obj.traverse(child => {
                        if (child.material) {
                            child.material.color.setHex(0xcccccc);
                            child.material.opacity = 0.3;
                            child.material.transparent = true;
                        }
                    });
                }
            });

            setTimeout(() => {
                // AI makes choice
                const choices = ['rock', 'paper', 'scissors'];
                const aiChoice = choices[Math.floor(Math.random() * choices.length)];

                // Show AI choice
                aiChoices[aiChoice].visible = true;
                aiChoices[aiChoice].scale.set(0, 0, 0);
                animateScale(aiChoices[aiChoice], 0.8, 400);

                setTimeout(() => {
                    // Determine winner
                    const result = determineWinner(playerChoice, aiChoice);
                    handleResult(result, playerChoice, aiChoice);
                }, 600);
            }, 800);
        }

        function determineWinner(player, ai) {
            if (player === ai) return 'draw';
            if (
                (player === 'rock' && ai === 'scissors') ||
                (player === 'paper' && ai === 'rock') ||
                (player === 'scissors' && ai === 'paper')
            ) {
                return 'player';
            }
            return 'ai';
        }

        function handleResult(result, playerChoice, aiChoice) {
            const resultEl = document.getElementById('result');

            if (result === 'player') {
                resultEl.textContent = 'You Win';
                resultEl.className = 'show win';
                gameState.playerScore++;
            } else if (result === 'ai') {
                resultEl.textContent = 'AI Wins';
                resultEl.className = 'show lose';
                gameState.aiScore++;
            } else {
                resultEl.textContent = 'Draw';
                resultEl.className = 'show draw';
                gameState.drawScore++;
            }

            updateScore();

            setTimeout(() => {
                resultEl.className = '';
                resetRound();
            }, 1500);
        }

        function resetRound() {
            // Hide AI choices
            Object.values(aiChoices).forEach(obj => {
                obj.visible = false;
            });

            // Reset player choices
            Object.values(playerChoices).forEach(obj => {
                resetObjectScale(obj);
                obj.traverse(child => {
                    if (child.material) {
                        child.material.color.setHex(0x333333);
                        child.material.opacity = 1;
                        child.material.transparent = false;
                    }
                });
            });

            gameState.isPlaying = false;
        }

        function resetObjectScale(object) {
            if (object.userData.side === 'player') {
                object.scale.set(1, 1, 1);
            } else {
                object.scale.set(0.8, 0.8, 0.8);
            }
        }

        function animateScale(object, targetScale, duration) {
            const startScale = 0;
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);

                const scale = startScale + (targetScale - startScale) * eased;
                object.scale.set(scale, scale, scale);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            animate();
        }

        function updateScore() {
            document.getElementById('player-score').textContent = gameState.playerScore;
            document.getElementById('ai-score').textContent = gameState.aiScore;
            document.getElementById('draw-score').textContent = gameState.drawScore;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Very subtle rotation when idle
            if (!gameState.isPlaying) {
                Object.values(playerChoices).forEach(obj => {
                    obj.rotation.y += 0.003;
                });
            }

            renderer.render(scene, camera);
        }

        // Initialize immediately
        init();
    </script>
</body>
</html>
