<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            background: #e8dcc4;
            color: #5a4a3a;
            cursor: default;
        }

        #score {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 80px;
            font-size: 1em;
            color: #8b7355;
            pointer-events: none;
            z-index: 100;
            font-weight: 300;
            letter-spacing: 3px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.75em;
            opacity: 0.6;
            margin-bottom: 8px;
            text-transform: lowercase;
            font-style: italic;
        }

        .score-value {
            font-size: 2.5em;
            font-weight: 300;
            color: #5a4a3a;
        }

        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 100;
            text-transform: lowercase;
            font-style: italic;
            color: #5a4a3a;
        }

        #result.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="score">
        <div class="score-item">
            <div class="score-label">you</div>
            <div class="score-value" id="player-score">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">draw</div>
            <div class="score-value" id="draw-score">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">ai</div>
            <div class="score-value" id="ai-score">0</div>
        </div>
    </div>

    <div id="result"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game State
        const gameState = {
            playerScore: 0,
            aiScore: 0,
            drawScore: 0,
            isPlaying: false,
            hoveredObject: null
        };

        // Three.js Setup
        let scene, camera, renderer, raycaster, mouse;
        let playerChoices = {}, aiChoices = {};

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe8dcc4); // Warm beige
            scene.fog = new THREE.Fog(0xe8dcc4, 30, 60);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 16, 22);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Warm ambient light
            const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.8);
            scene.add(ambientLight);

            // Soft directional light (like sunlight through shoji screen)
            const mainLight = new THREE.DirectionalLight(0xfff5e6, 0.4);
            mainLight.position.set(10, 20, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.left = -20;
            mainLight.shadow.camera.right = 20;
            mainLight.shadow.camera.top = 20;
            mainLight.shadow.camera.bottom = -20;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            // Soft fill light
            const fillLight = new THREE.HemisphereLight(0xfff5e6, 0xd4c4a8, 0.5);
            scene.add(fillLight);

            // Create table
            createTable();

            // Create player choices
            createPlayerChoices();

            // Create AI choices
            createAIChoices();

            // Create floor
            createFloor();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);

            // Start animation
            animate();
        }

        function createTable() {
            // Wooden table top with texture
            const topGeometry = new THREE.BoxGeometry(18, 0.5, 13);
            const topMaterial = new THREE.MeshStandardMaterial({
                color: 0xa0826d, // Warm wood color
                roughness: 0.9,
                metalness: 0.0
            });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = 0;
            top.castShadow = true;
            top.receiveShadow = true;
            scene.add(top);

            // Subtle wood grain simulation with overlays
            const grainGeometry = new THREE.BoxGeometry(18.1, 0.01, 13.1);
            const grainMaterial = new THREE.MeshBasicMaterial({
                color: 0x8b7355,
                transparent: true,
                opacity: 0.1
            });
            const grain = new THREE.Mesh(grainGeometry, grainMaterial);
            grain.position.y = 0.26;
            scene.add(grain);

            // Thin center line (like a zen garden rake line)
            const lineGeometry = new THREE.BoxGeometry(18, 0.01, 0.03);
            const lineMaterial = new THREE.MeshBasicMaterial({
                color: 0x8b7355,
                transparent: true,
                opacity: 0.3
            });
            const line = new THREE.Mesh(lineGeometry, lineMaterial);
            line.position.y = 0.3;
            scene.add(line);
        }

        function createRock(color) {
            // Natural stone/pebble
            const geometry = new THREE.SphereGeometry(0.7, 16, 16);
            // Make it slightly irregular
            const positions = geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const noise = (Math.random() - 0.5) * 0.15;
                positions.setXYZ(
                    i,
                    positions.getX(i) * (1 + noise),
                    positions.getY(i) * (1 + noise),
                    positions.getZ(i) * (1 + noise)
                );
            }
            positions.needsUpdate = true;
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.95,
                metalness: 0.0
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function createPaper(color) {
            // Parchment/washi paper
            const geometry = new THREE.BoxGeometry(1.6, 0.01, 1.6);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.95,
                metalness: 0.0
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = Math.PI * 0.02;
            mesh.rotation.z = Math.PI * 0.01;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function createScissors(color) {
            // Bamboo/wood sticks
            const group = new THREE.Group();

            const stickGeometry = new THREE.CylinderGeometry(0.06, 0.06, 1.6, 8);
            const stickMaterial = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.9,
                metalness: 0.0
            });

            const stick1 = new THREE.Mesh(stickGeometry, stickMaterial);
            stick1.position.set(-0.25, 0.5, 0);
            stick1.rotation.z = -0.35;
            stick1.castShadow = true;

            const stick2 = new THREE.Mesh(stickGeometry, stickMaterial);
            stick2.position.set(0.25, 0.5, 0);
            stick2.rotation.z = 0.35;
            stick2.castShadow = true;

            group.add(stick1);
            group.add(stick2);

            return group;
        }

        function createPlayerChoices() {
            const spacing = 5;
            const yPos = 1;
            const zPos = 5;

            // Rock - gray stone
            const rock = createRock(0x9a8c7a);
            rock.position.set(-spacing, yPos, zPos);
            rock.userData = { type: 'rock', side: 'player', clickable: true, originalColor: 0x9a8c7a };
            scene.add(rock);
            playerChoices.rock = rock;

            // Paper - cream parchment
            const paper = createPaper(0xf5ead6);
            paper.position.set(0, yPos, zPos);
            paper.userData = { type: 'paper', side: 'player', clickable: true, originalColor: 0xf5ead6 };
            scene.add(paper);
            playerChoices.paper = paper;

            // Scissors - dark wood/bamboo
            const scissors = createScissors(0x6b5d4f);
            scissors.position.set(spacing, yPos, zPos);
            scissors.userData = { type: 'scissors', side: 'player', clickable: true, originalColor: 0x6b5d4f };
            scene.add(scissors);
            playerChoices.scissors = scissors;
        }

        function createAIChoices() {
            const spacing = 5;
            const yPos = 1;
            const zPos = -5;

            // Rock - lighter stone
            const rock = createRock(0xb5a593);
            rock.position.set(-spacing, yPos, zPos);
            rock.scale.set(0.8, 0.8, 0.8);
            rock.userData = { type: 'rock', side: 'ai' };
            rock.visible = false;
            scene.add(rock);
            aiChoices.rock = rock;

            // Paper - slightly different cream
            const paper = createPaper(0xfaf5e9);
            paper.position.set(0, yPos, zPos);
            paper.scale.set(0.8, 0.8, 0.8);
            paper.userData = { type: 'paper', side: 'ai' };
            paper.visible = false;
            scene.add(paper);
            aiChoices.paper = paper;

            // Scissors - lighter bamboo
            const scissors = createScissors(0x8b7d6b);
            scissors.position.set(spacing, yPos, zPos);
            scissors.scale.set(0.8, 0.8, 0.8);
            scissors.userData = { type: 'scissors', side: 'ai' };
            scissors.visible = false;
            scene.add(scissors);
            aiChoices.scissors = scissors;
        }

        function createFloor() {
            // Sand/tatami colored floor
            const floorGeometry = new THREE.PlaneGeometry(120, 120);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0xd4c4a8, // Sandy/tatami color
                roughness: 1.0,
                metalness: 0.0
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -3;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const clickableObjects = Object.values(playerChoices);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            // Reset previous hover
            if (gameState.hoveredObject && !gameState.isPlaying) {
                resetObjectScale(gameState.hoveredObject);
                gameState.hoveredObject.traverse(child => {
                    if (child.material) {
                        child.material.color.setHex(gameState.hoveredObject.userData.originalColor);
                    }
                });
                gameState.hoveredObject = null;
            }

            if (intersects.length > 0 && !gameState.isPlaying) {
                let object = intersects[0].object;
                while (object.parent && !object.userData.clickable) {
                    object = object.parent;
                }

                if (object.userData.clickable) {
                    gameState.hoveredObject = object;
                    object.scale.set(1.1, 1.1, 1.1);
                    // Darken slightly on hover
                    object.traverse(child => {
                        if (child.material) {
                            const originalColor = object.userData.originalColor;
                            const r = ((originalColor >> 16) & 255) * 0.8;
                            const g = ((originalColor >> 8) & 255) * 0.8;
                            const b = (originalColor & 255) * 0.8;
                            child.material.color.setRGB(r/255, g/255, b/255);
                        }
                    });
                    document.body.style.cursor = 'pointer';
                    return;
                }
            }

            document.body.style.cursor = gameState.isPlaying ? 'wait' : 'default';
        }

        function onClick(event) {
            if (gameState.isPlaying) return;

            raycaster.setFromCamera(mouse, camera);
            const clickableObjects = Object.values(playerChoices);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                let object = intersects[0].object;
                while (object.parent && !object.userData.clickable) {
                    object = object.parent;
                }

                if (object.userData.clickable) {
                    playRound(object.userData.type);
                }
            }
        }

        function playRound(playerChoice) {
            gameState.isPlaying = true;

            // Emphasize player choice
            playerChoices[playerChoice].traverse(child => {
                if (child.material) {
                    const originalColor = playerChoices[playerChoice].userData.originalColor;
                    const r = ((originalColor >> 16) & 255) * 0.7;
                    const g = ((originalColor >> 8) & 255) * 0.7;
                    const b = (originalColor & 255) * 0.7;
                    child.material.color.setRGB(r/255, g/255, b/255);
                }
            });

            // Fade other choices
            Object.entries(playerChoices).forEach(([type, obj]) => {
                if (type !== playerChoice) {
                    obj.traverse(child => {
                        if (child.material) {
                            child.material.opacity = 0.3;
                            child.material.transparent = true;
                        }
                    });
                }
            });

            setTimeout(() => {
                // AI makes choice
                const choices = ['rock', 'paper', 'scissors'];
                const aiChoice = choices[Math.floor(Math.random() * choices.length)];

                // Show AI choice with gentle appearance
                aiChoices[aiChoice].visible = true;
                aiChoices[aiChoice].scale.set(0, 0, 0);
                animateScale(aiChoices[aiChoice], 0.8, 600);

                setTimeout(() => {
                    const result = determineWinner(playerChoice, aiChoice);
                    handleResult(result, playerChoice, aiChoice);
                }, 800);
            }, 1000);
        }

        function determineWinner(player, ai) {
            if (player === ai) return 'draw';
            if (
                (player === 'rock' && ai === 'scissors') ||
                (player === 'paper' && ai === 'rock') ||
                (player === 'scissors' && ai === 'paper')
            ) {
                return 'player';
            }
            return 'ai';
        }

        function handleResult(result, playerChoice, aiChoice) {
            const resultEl = document.getElementById('result');

            if (result === 'player') {
                resultEl.textContent = 'harmony';
                gameState.playerScore++;
            } else if (result === 'ai') {
                resultEl.textContent = 'balance';
                gameState.aiScore++;
            } else {
                resultEl.textContent = 'unity';
                gameState.drawScore++;
            }

            resultEl.className = 'show';
            updateScore();

            setTimeout(() => {
                resultEl.className = '';
                resetRound();
            }, 2000);
        }

        function resetRound() {
            // Hide AI choices gently
            Object.values(aiChoices).forEach(obj => {
                obj.visible = false;
            });

            // Reset player choices
            Object.values(playerChoices).forEach(obj => {
                resetObjectScale(obj);
                obj.traverse(child => {
                    if (child.material) {
                        child.material.color.setHex(obj.userData.originalColor);
                        child.material.opacity = 1;
                        child.material.transparent = false;
                    }
                });
            });

            gameState.isPlaying = false;
        }

        function resetObjectScale(object) {
            if (object.userData.side === 'player') {
                object.scale.set(1, 1, 1);
            } else {
                object.scale.set(0.8, 0.8, 0.8);
            }
        }

        function animateScale(object, targetScale, duration) {
            const startScale = 0;
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // Ease out cubic for gentle appearance
                const eased = 1 - Math.pow(1 - progress, 3);

                const scale = startScale + (targetScale - startScale) * eased;
                object.scale.set(scale, scale, scale);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            animate();
        }

        function updateScore() {
            document.getElementById('player-score').textContent = gameState.playerScore;
            document.getElementById('ai-score').textContent = gameState.aiScore;
            document.getElementById('draw-score').textContent = gameState.drawScore;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Extremely gentle breathing rotation
            if (!gameState.isPlaying) {
                const time = Date.now() * 0.0005;
                Object.values(playerChoices).forEach(obj => {
                    obj.rotation.y = Math.sin(time) * 0.1;
                });
            }

            renderer.render(scene, camera);
        }

        // Initialize
        init();
    </script>
</body>
</html>
