<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rock Paper Scissors - Immersive Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
            cursor: crosshair;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 1.2em;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            pointer-events: none;
            z-index: 100;
        }

        #score {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            font-size: 1.5em;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            pointer-events: none;
            z-index: 100;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.6em;
            opacity: 0.8;
        }

        .score-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            font-weight: bold;
            text-shadow: 0 0 20px currentColor;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #result.show {
            opacity: 1;
        }

        #result.win {
            color: #00ff00;
        }

        #result.lose {
            color: #ff0000;
        }

        #result.draw {
            color: #ffff00;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .start-content {
            text-align: center;
            padding: 40px;
            background: rgba(0, 50, 100, 0.5);
            border: 3px solid #00ffff;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
        }

        .start-content h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
        }

        .start-content p {
            font-size: 1.1em;
            margin: 15px 0;
            color: #fff;
            line-height: 1.6;
        }

        #start-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.5em;
            background: rgba(0, 100, 150, 0.8);
            border: 3px solid #00ffff;
            border-radius: 10px;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        #start-btn:hover {
            background: rgba(0, 150, 200, 0.9);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
            transform: scale(1.05);
        }

        .hover-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            color: #00ffff;
            opacity: 0.6;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <div class="start-content">
            <h1>🎮 3D ROCK PAPER SCISSORS 🎮</h1>
            <p>An immersive tabletop experience</p>
            <p>Click on your choice on the near side of the table</p>
            <p>Rock, Paper, or Scissors</p>
            <p>The AI will make its move on the far side</p>
            <button id="start-btn">START GAME</button>
        </div>
    </div>

    <div id="info">Click on your choice to play!</div>

    <div id="score">
        <div class="score-item">
            <div class="score-label">YOU</div>
            <div class="score-value" id="player-score">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">DRAWS</div>
            <div class="score-value" id="draw-score">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">AI</div>
            <div class="score-value" id="ai-score">0</div>
        </div>
    </div>

    <div id="result"></div>

    <div class="hover-hint">Hover over objects to highlight them</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game State
        const gameState = {
            playerScore: 0,
            aiScore: 0,
            drawScore: 0,
            isPlaying: false,
            playerObjects: {},
            aiObjects: {},
            hoveredObject: null
        };

        // Three.js Setup
        let scene, camera, renderer, raycaster, mouse;
        let table, playerChoices = {}, aiChoices = {};

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000510, 20, 60);
            scene.background = new THREE.Color(0x000510);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 18);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Raycaster for mouse picking
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(5, 15, 5);
            mainLight.castShadow = true;
            mainLight.shadow.camera.left = -15;
            mainLight.shadow.camera.right = 15;
            mainLight.shadow.camera.top = 15;
            mainLight.shadow.camera.bottom = -15;
            scene.add(mainLight);

            const fillLight1 = new THREE.PointLight(0x00ffff, 0.4, 30);
            fillLight1.position.set(-8, 8, 8);
            scene.add(fillLight1);

            const fillLight2 = new THREE.PointLight(0xff00ff, 0.4, 30);
            fillLight2.position.set(8, 8, -8);
            scene.add(fillLight2);

            // Create table
            createTable();

            // Create player choices (near side)
            createPlayerChoices();

            // Create AI choices (far side)
            createAIChoices();

            // Create environment
            createEnvironment();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);

            // Start animation
            animate();
        }

        function createTable() {
            // Table top
            const topGeometry = new THREE.BoxGeometry(14, 0.5, 10);
            const topMaterial = new THREE.MeshPhongMaterial({
                color: 0x1a3050,
                shininess: 60
            });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = 0;
            top.receiveShadow = true;
            scene.add(top);

            // Table edge glow
            const edgeGeometry = new THREE.BoxGeometry(14.2, 0.6, 10.2);
            const edgeMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.3,
                wireframe: true
            });
            const edge = new THREE.Mesh(edgeGeometry, edgeMaterial);
            edge.position.y = 0;
            scene.add(edge);

            // Center line
            const lineGeometry = new THREE.BoxGeometry(14, 0.05, 0.1);
            const lineMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.6
            });
            const line = new THREE.Mesh(lineGeometry, lineMaterial);
            line.position.y = 0.3;
            scene.add(line);

            table = top;
        }

        function createRock(color) {
            const geometry = new THREE.IcosahedronGeometry(1, 1);
            const material = new THREE.MeshPhongMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.2,
                shininess: 30,
                flatShading: true
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function createPaper(color) {
            const geometry = new THREE.BoxGeometry(1.8, 0.05, 1.8);
            const material = new THREE.MeshPhongMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.2,
                shininess: 100
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = Math.PI * 0.1;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function createScissors(color) {
            const group = new THREE.Group();

            const bladeGeometry = new THREE.ConeGeometry(0.15, 2, 4);
            const bladeMaterial = new THREE.MeshPhongMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.2,
                shininess: 100
            });

            const blade1 = new THREE.Mesh(bladeGeometry, bladeMaterial);
            blade1.position.set(-0.4, 0.5, 0);
            blade1.rotation.z = -0.4;
            blade1.castShadow = true;

            const blade2 = new THREE.Mesh(bladeGeometry, bladeMaterial);
            blade2.position.set(0.4, 0.5, 0);
            blade2.rotation.z = 0.4;
            blade2.castShadow = true;

            group.add(blade1);
            group.add(blade2);

            return group;
        }

        function createPlayerChoices() {
            const playerColor = 0x00ffff;
            const spacing = 4;
            const yPos = 1;
            const zPos = 4;

            // Rock
            const rock = createRock(playerColor);
            rock.position.set(-spacing, yPos, zPos);
            rock.userData = { type: 'rock', side: 'player', clickable: true };
            scene.add(rock);
            playerChoices.rock = rock;

            // Paper
            const paper = createPaper(playerColor);
            paper.position.set(0, yPos, zPos);
            paper.userData = { type: 'paper', side: 'player', clickable: true };
            scene.add(paper);
            playerChoices.paper = paper;

            // Scissors
            const scissors = createScissors(playerColor);
            scissors.position.set(spacing, yPos, zPos);
            scissors.userData = { type: 'scissors', side: 'player', clickable: true };
            scene.add(scissors);
            playerChoices.scissors = scissors;
        }

        function createAIChoices() {
            const aiColor = 0xff00ff;
            const spacing = 4;
            const yPos = 1;
            const zPos = -4;

            // Rock
            const rock = createRock(aiColor);
            rock.position.set(-spacing, yPos, zPos);
            rock.scale.set(0.7, 0.7, 0.7);
            rock.userData = { type: 'rock', side: 'ai' };
            rock.visible = false;
            scene.add(rock);
            aiChoices.rock = rock;

            // Paper
            const paper = createPaper(aiColor);
            paper.position.set(0, yPos, zPos);
            paper.scale.set(0.7, 0.7, 0.7);
            paper.userData = { type: 'paper', side: 'ai' };
            paper.visible = false;
            scene.add(paper);
            aiChoices.paper = paper;

            // Scissors
            const scissors = createScissors(aiColor);
            scissors.position.set(spacing, yPos, zPos);
            scissors.scale.set(0.7, 0.7, 0.7);
            scissors.userData = { type: 'scissors', side: 'ai' };
            scissors.visible = false;
            scene.add(scissors);
            aiChoices.scissors = scissors;
        }

        function createEnvironment() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshPhongMaterial({
                color: 0x001020,
                shininess: 80
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -3;
            floor.receiveShadow = true;
            scene.add(floor);

            // Ambient particles
            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = 100;
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 40;
                positions[i + 1] = Math.random() * 30;
                positions[i + 2] = (Math.random() - 0.5) * 40;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const particleMaterial = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.15,
                transparent: true,
                opacity: 0.4
            });

            const particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Check for hover
            raycaster.setFromCamera(mouse, camera);
            const clickableObjects = Object.values(playerChoices);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            // Reset previous hover
            if (gameState.hoveredObject && !gameState.isPlaying) {
                resetObjectScale(gameState.hoveredObject);
                gameState.hoveredObject.traverse(child => {
                    if (child.material) {
                        child.material.emissiveIntensity = 0.2;
                    }
                });
                gameState.hoveredObject = null;
            }

            if (intersects.length > 0 && !gameState.isPlaying) {
                let object = intersects[0].object;
                while (object.parent && !object.userData.clickable) {
                    object = object.parent;
                }

                if (object.userData.clickable) {
                    gameState.hoveredObject = object;
                    object.scale.set(1.2, 1.2, 1.2);
                    object.traverse(child => {
                        if (child.material) {
                            child.material.emissiveIntensity = 0.6;
                        }
                    });
                    document.body.style.cursor = 'pointer';
                    return;
                }
            }

            document.body.style.cursor = gameState.isPlaying ? 'wait' : 'crosshair';
        }

        function onClick(event) {
            if (gameState.isPlaying) return;

            raycaster.setFromCamera(mouse, camera);
            const clickableObjects = Object.values(playerChoices);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                let object = intersects[0].object;
                while (object.parent && !object.userData.clickable) {
                    object = object.parent;
                }

                if (object.userData.clickable) {
                    playRound(object.userData.type);
                }
            }
        }

        function playRound(playerChoice) {
            gameState.isPlaying = true;
            document.getElementById('info').textContent = 'AI is choosing...';

            // Highlight player choice
            highlightChoice(playerChoices[playerChoice], true);

            // Dim other player choices
            Object.entries(playerChoices).forEach(([type, obj]) => {
                if (type !== playerChoice) {
                    dimObject(obj);
                }
            });

            setTimeout(() => {
                // AI makes choice
                const choices = ['rock', 'paper', 'scissors'];
                const aiChoice = choices[Math.floor(Math.random() * choices.length)];

                // Show AI choice
                aiChoices[aiChoice].visible = true;
                highlightChoice(aiChoices[aiChoice], false);

                // Animate AI choice appearing
                aiChoices[aiChoice].scale.set(0, 0, 0);
                animateScale(aiChoices[aiChoice], 0.7, 500);

                setTimeout(() => {
                    // Determine winner
                    const result = determineWinner(playerChoice, aiChoice);
                    handleResult(result, playerChoice, aiChoice);
                }, 800);
            }, 1500);
        }

        function determineWinner(player, ai) {
            if (player === ai) return 'draw';
            if (
                (player === 'rock' && ai === 'scissors') ||
                (player === 'paper' && ai === 'rock') ||
                (player === 'scissors' && ai === 'paper')
            ) {
                return 'player';
            }
            return 'ai';
        }

        function handleResult(result, playerChoice, aiChoice) {
            const resultEl = document.getElementById('result');

            if (result === 'player') {
                resultEl.textContent = 'YOU WIN!';
                resultEl.className = 'show win';
                gameState.playerScore++;
                createExplosion(playerChoices[playerChoice].position, 0x00ff00);
                shakeObject(aiChoices[aiChoice]);
            } else if (result === 'ai') {
                resultEl.textContent = 'AI WINS!';
                resultEl.className = 'show lose';
                gameState.aiScore++;
                createExplosion(aiChoices[aiChoice].position, 0xff0000);
                shakeObject(playerChoices[playerChoice]);
            } else {
                resultEl.textContent = 'DRAW!';
                resultEl.className = 'show draw';
                gameState.drawScore++;
                createExplosion(new THREE.Vector3(0, 2, 0), 0xffff00);
            }

            updateScore();

            setTimeout(() => {
                resultEl.className = '';
                resetRound();
            }, 2500);
        }

        function resetRound() {
            // Hide AI choices
            Object.values(aiChoices).forEach(obj => {
                obj.visible = false;
            });

            // Reset player choices
            Object.values(playerChoices).forEach(obj => {
                resetObjectScale(obj);
                obj.traverse(child => {
                    if (child.material) {
                        child.material.emissiveIntensity = 0.2;
                        child.material.opacity = 1;
                    }
                });
            });

            gameState.isPlaying = false;
            document.getElementById('info').textContent = 'Click on your choice to play!';
        }

        function highlightChoice(object, isPlayer) {
            object.traverse(child => {
                if (child.material) {
                    child.material.emissiveIntensity = 0.8;
                }
            });
        }

        function dimObject(object) {
            object.traverse(child => {
                if (child.material) {
                    child.material.emissiveIntensity = 0.05;
                    child.material.opacity = 0.3;
                    child.material.transparent = true;
                }
            });
        }

        function resetObjectScale(object) {
            if (object.userData.side === 'player') {
                object.scale.set(1, 1, 1);
            } else {
                object.scale.set(0.7, 0.7, 0.7);
            }
        }

        function animateScale(object, targetScale, duration) {
            const startScale = 0;
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // Ease out cubic

                const scale = startScale + (targetScale - startScale) * eased;
                object.scale.set(scale, scale, scale);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            animate();
        }

        function shakeObject(object) {
            const originalPos = object.position.clone();
            const startTime = Date.now();
            const duration = 500;
            const intensity = 0.2;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;

                if (progress < 1) {
                    const shakeX = (Math.random() - 0.5) * intensity * (1 - progress);
                    const shakeZ = (Math.random() - 0.5) * intensity * (1 - progress);
                    object.position.x = originalPos.x + shakeX;
                    object.position.z = originalPos.z + shakeZ;
                    requestAnimationFrame(animate);
                } else {
                    object.position.copy(originalPos);
                }
            }

            animate();
        }

        function createExplosion(position, color) {
            const particleCount = 30;
            const particles = [];

            for (let i = 0; i < particleCount; i++) {
                const geometry = new THREE.SphereGeometry(0.1, 8, 8);
                const material = new THREE.MeshBasicMaterial({ color: color });
                const particle = new THREE.Mesh(geometry, material);

                particle.position.copy(position);
                particle.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    Math.random() * 0.3,
                    (Math.random() - 0.5) * 0.3
                );

                scene.add(particle);
                particles.push(particle);
            }

            const startTime = Date.now();
            const duration = 1000;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;

                if (progress < 1) {
                    particles.forEach(p => {
                        p.position.add(p.userData.velocity);
                        p.userData.velocity.y -= 0.01; // Gravity
                        p.material.opacity = 1 - progress;
                        p.material.transparent = true;
                    });
                    requestAnimationFrame(animate);
                } else {
                    particles.forEach(p => scene.remove(p));
                }
            }

            animate();
        }

        function updateScore() {
            document.getElementById('player-score').textContent = gameState.playerScore;
            document.getElementById('ai-score').textContent = gameState.aiScore;
            document.getElementById('draw-score').textContent = gameState.drawScore;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Gentle rotation of objects when not playing
            if (!gameState.isPlaying) {
                Object.values(playerChoices).forEach(obj => {
                    obj.rotation.y += 0.005;
                });
            }

            renderer.render(scene, camera);
        }

        // Start button
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
        });

        // Initialize
        init();
    </script>
</body>
</html>
