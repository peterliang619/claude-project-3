<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rock Paper Scissors vs AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.8);
            padding: 20px 40px;
            border-radius: 15px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            text-align: center;
        }

        #score-panel h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .score-row {
            display: flex;
            justify-content: space-around;
            gap: 40px;
            font-size: 1.2em;
            margin-top: 10px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            color: #00ffff;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            pointer-events: all;
        }

        .choice-btn {
            width: 120px;
            height: 120px;
            background: rgba(0, 50, 100, 0.8);
            border: 3px solid #00ffff;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
            background: rgba(0, 100, 150, 0.9);
        }

        .choice-btn:active {
            transform: translateY(-5px);
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .choice-btn:hover::before {
            left: 100%;
        }

        .choice-label {
            font-size: 0.3em;
            margin-top: 5px;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .choice-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        #ai-dialogue {
            position: absolute;
            top: 120px;
            right: 30px;
            background: rgba(20, 0, 40, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff00ff;
            max-width: 300px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            animation: fadeIn 0.5s;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-text {
            color: #ff00ff;
            font-size: 1.1em;
            font-style: italic;
            text-shadow: 0 0 5px #ff00ff;
        }

        #result-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px;
            border-radius: 20px;
            border: 3px solid #00ffff;
            text-align: center;
            font-size: 2em;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
            display: none;
            animation: popIn 0.5s;
            pointer-events: none;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .result-win {
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
        }

        .result-lose {
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
        }

        .result-draw {
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00;
        }

        #difficulty-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 20, 40, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            pointer-events: all;
        }

        #difficulty-panel h3 {
            color: #00ffff;
            font-size: 1em;
            margin-bottom: 10px;
        }

        #difficulty-slider {
            width: 200px;
            cursor: pointer;
        }

        .difficulty-label {
            color: #fff;
            font-size: 0.9em;
            margin-top: 5px;
            text-align: center;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .start-content {
            text-align: center;
            padding: 40px;
            background: rgba(0, 50, 100, 0.5);
            border: 3px solid #00ffff;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
        }

        .start-content h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
        }

        .start-content p {
            font-size: 1.2em;
            margin: 15px 0;
            color: #fff;
        }

        #start-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.5em;
            background: rgba(0, 100, 150, 0.8);
            border: 3px solid #00ffff;
            border-radius: 10px;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        #start-btn:hover {
            background: rgba(0, 150, 200, 0.9);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
            transform: scale(1.05);
        }

        .keyboard-hint {
            margin-top: 20px;
            font-size: 0.9em;
            color: #00ffff;
            opacity: 0.7;
        }

        #round-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff;
            display: none;
            animation: countdown 1s;
            pointer-events: none;
        }

        @keyframes countdown {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div id="start-screen">
            <div class="start-content">
                <h1>🤖 3D ROCK PAPER SCISSORS 🤖</h1>
                <p>Face the AI in an epic holographic showdown!</p>
                <p>Choose your weapon wisely...</p>
                <button id="start-btn">START GAME</button>
                <div class="keyboard-hint">Use 1, 2, 3 or click buttons to choose</div>
            </div>
        </div>

        <div id="score-panel">
            <h2>HOLOGRAPHIC ARENA</h2>
            <div class="score-row">
                <div class="score-item">
                    <div class="score-label">PLAYER</div>
                    <div class="score-value" id="player-score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">DRAWS</div>
                    <div class="score-value" id="draw-score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">AI</div>
                    <div class="score-value" id="ai-score">0</div>
                </div>
            </div>
        </div>

        <div id="difficulty-panel">
            <h3>AI DIFFICULTY</h3>
            <input type="range" id="difficulty-slider" min="0" max="100" value="30">
            <div class="difficulty-label" id="difficulty-label">Normal</div>
        </div>

        <div id="round-indicator">READY?</div>

        <div id="result-display"></div>

        <div id="controls">
            <button class="choice-btn" data-choice="rock" id="rock-btn">
                ✊
                <div class="choice-label">ROCK</div>
            </button>
            <button class="choice-btn" data-choice="paper" id="paper-btn">
                ✋
                <div class="choice-label">PAPER</div>
            </button>
            <button class="choice-btn" data-choice="scissors" id="scissors-btn">
                ✌️
                <div class="choice-label">SCISSORS</div>
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game State
        const gameState = {
            playerScore: 0,
            aiScore: 0,
            drawScore: 0,
            playerChoice: null,
            aiChoice: null,
            isPlaying: false,
            difficulty: 30,
            playerHistory: [],
            aiPersonality: 'confident'
        };

        // AI Dialogues
        const aiDialogues = {
            win: [
                "Too easy! 😎",
                "You thought I wouldn't see that coming?",
                "My algorithms predicted this!",
                "Victory is mine! 🤖",
                "Humans are so predictable!",
                "Better luck next time!",
                "I am inevitable!"
            ],
            lose: [
                "Impressive... for a human.",
                "You got lucky this time!",
                "How did you...?! 😤",
                "Recalculating strategies...",
                "This wasn't in my predictions!",
                "Enjoy this rare victory!",
                "I let you win. Obviously."
            ],
            draw: [
                "Great minds think alike!",
                "We're evenly matched!",
                "Synchronization detected!",
                "Again? Interesting...",
                "The universe balanced itself.",
                "A stalemate... for now."
            ],
            taunt: [
                "Make your move, human!",
                "I'm analyzing your patterns...",
                "Ready to lose again?",
                "Show me what you've got!",
                "This will be interesting...",
                "Choose wisely!"
            ]
        };

        // Three.js Setup
        let scene, camera, renderer, playerSymbol, aiSymbol, aiCharacter;
        let particles = [];
        let animationId;

        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const spotLight1 = new THREE.SpotLight(0x00ffff, 1);
            spotLight1.position.set(-10, 15, 10);
            spotLight1.castShadow = true;
            spotLight1.angle = Math.PI / 6;
            spotLight1.penumbra = 0.2;
            scene.add(spotLight1);

            const spotLight2 = new THREE.SpotLight(0xff00ff, 1);
            spotLight2.position.set(10, 15, 10);
            spotLight2.castShadow = true;
            spotLight2.angle = Math.PI / 6;
            spotLight2.penumbra = 0.2;
            scene.add(spotLight2);

            const backLight = new THREE.PointLight(0x00ffff, 0.5);
            backLight.position.set(0, 5, -10);
            scene.add(backLight);

            // Arena Platform
            const platformGeometry = new THREE.CylinderGeometry(8, 8, 0.5, 32);
            const platformMaterial = new THREE.MeshPhongMaterial({
                color: 0x001a33,
                emissive: 0x003366,
                transparent: true,
                opacity: 0.8,
                shininess: 100
            });
            const platform = new THREE.Mesh(platformGeometry, platformMaterial);
            platform.position.y = -1;
            platform.receiveShadow = true;
            scene.add(platform);

            // Platform Edge Glow
            const edgeGeometry = new THREE.TorusGeometry(8, 0.1, 16, 100);
            const edgeMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8
            });
            const edge = new THREE.Mesh(edgeGeometry, edgeMaterial);
            edge.position.y = -0.75;
            edge.rotation.x = Math.PI / 2;
            scene.add(edge);

            // Grid Lines
            for (let i = -8; i <= 8; i += 2) {
                const lineMaterial = new THREE.LineBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.2
                });

                const points1 = [
                    new THREE.Vector3(i, -0.74, -8),
                    new THREE.Vector3(i, -0.74, 8)
                ];
                const geometry1 = new THREE.BufferGeometry().setFromPoints(points1);
                const line1 = new THREE.Line(geometry1, lineMaterial);
                scene.add(line1);

                const points2 = [
                    new THREE.Vector3(-8, -0.74, i),
                    new THREE.Vector3(8, -0.74, i)
                ];
                const geometry2 = new THREE.BufferGeometry().setFromPoints(points2);
                const line2 = new THREE.Line(geometry2, lineMaterial);
                scene.add(line2);
            }

            // AI Character (Glowing Sphere)
            const aiGeometry = new THREE.SphereGeometry(1, 32, 32);
            const aiMaterial = new THREE.MeshPhongMaterial({
                color: 0xff00ff,
                emissive: 0xff00ff,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.8,
                shininess: 100
            });
            aiCharacter = new THREE.Mesh(aiGeometry, aiMaterial);
            aiCharacter.position.set(0, 2, -6);
            aiCharacter.castShadow = true;
            scene.add(aiCharacter);

            // AI Character Glow Ring
            const ringGeometry = new THREE.TorusGeometry(1.3, 0.05, 16, 100);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xff00ff,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            aiCharacter.add(ring);

            // Player Indicator
            const playerGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const playerMaterial = new THREE.MeshPhongMaterial({
                color: 0x00ffff,
                emissive: 0x00ffff,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.6
            });
            const playerIndicator = new THREE.Mesh(playerGeometry, playerMaterial);
            playerIndicator.position.set(0, 1, 6);
            scene.add(playerIndicator);

            // Ambient Particles
            createAmbientParticles();

            // Window Resize
            window.addEventListener('resize', onWindowResize);
        }

        function createAmbientParticles() {
            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = 200;
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 30;
                positions[i + 1] = Math.random() * 20 - 5;
                positions[i + 2] = (Math.random() - 0.5) * 30;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const particleMaterial = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.1,
                transparent: true,
                opacity: 0.6
            });

            const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);
            particles.push(particleSystem);
        }

        function createSymbol(choice, position, isPlayer) {
            // Remove old symbol
            if (isPlayer && playerSymbol) {
                scene.remove(playerSymbol);
            } else if (!isPlayer && aiSymbol) {
                scene.remove(aiSymbol);
            }

            let geometry, material, symbol;
            const color = isPlayer ? 0x00ffff : 0xff00ff;

            switch(choice) {
                case 'rock':
                    geometry = new THREE.IcosahedronGeometry(1, 0);
                    material = new THREE.MeshPhongMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.3,
                        shininess: 50,
                        flatShading: true
                    });
                    symbol = new THREE.Mesh(geometry, material);
                    break;

                case 'paper':
                    geometry = new THREE.PlaneGeometry(2, 2);
                    material = new THREE.MeshPhongMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.3,
                        side: THREE.DoubleSide,
                        shininess: 100
                    });
                    symbol = new THREE.Mesh(geometry, material);
                    break;

                case 'scissors':
                    const scissorsGroup = new THREE.Group();

                    const blade1Geometry = new THREE.ConeGeometry(0.2, 2, 4);
                    const blade1Material = new THREE.MeshPhongMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.3,
                        shininess: 100
                    });
                    const blade1 = new THREE.Mesh(blade1Geometry, blade1Material);
                    blade1.position.set(-0.3, 0, 0);
                    blade1.rotation.z = -0.3;

                    const blade2 = blade1.clone();
                    blade2.position.set(0.3, 0, 0);
                    blade2.rotation.z = 0.3;

                    scissorsGroup.add(blade1);
                    scissorsGroup.add(blade2);
                    symbol = scissorsGroup;
                    break;
            }

            symbol.position.copy(position);
            symbol.castShadow = true;
            symbol.receiveShadow = true;
            scene.add(symbol);

            if (isPlayer) {
                playerSymbol = symbol;
            } else {
                aiSymbol = symbol;
            }

            // Spawn animation
            symbol.scale.set(0, 0, 0);
            animateSymbolSpawn(symbol);

            return symbol;
        }

        function animateSymbolSpawn(symbol) {
            const startTime = Date.now();
            const duration = 500;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                const scale = progress * 1;
                symbol.scale.set(scale, scale, scale);
                symbol.rotation.y = progress * Math.PI * 2;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            animate();
        }

        function createWinParticles(position, color) {
            const particleCount = 50;
            const particleGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = position.x;
                positions[i + 1] = position.y;
                positions[i + 2] = position.z;

                velocities.push({
                    x: (Math.random() - 0.5) * 0.2,
                    y: Math.random() * 0.2,
                    z: (Math.random() - 0.5) * 0.2
                });
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const particleMaterial = new THREE.PointsMaterial({
                color: color,
                size: 0.3,
                transparent: true,
                opacity: 1
            });

            const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);

            // Animate particles
            const startTime = Date.now();
            const duration = 2000;

            function animateParticles() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;

                if (progress < 1) {
                    const positions = particleSystem.geometry.attributes.position.array;

                    for (let i = 0; i < particleCount; i++) {
                        positions[i * 3] += velocities[i].x;
                        positions[i * 3 + 1] += velocities[i].y;
                        positions[i * 3 + 2] += velocities[i].z;

                        velocities[i].y -= 0.002; // Gravity
                    }

                    particleSystem.geometry.attributes.position.needsUpdate = true;
                    particleMaterial.opacity = 1 - progress;

                    requestAnimationFrame(animateParticles);
                } else {
                    scene.remove(particleSystem);
                }
            }

            animateParticles();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            // Rotate AI character
            if (aiCharacter) {
                aiCharacter.rotation.y += 0.01;
                aiCharacter.position.y = 2 + Math.sin(Date.now() * 0.001) * 0.2;
            }

            // Rotate symbols
            if (playerSymbol) {
                playerSymbol.rotation.y += 0.02;
            }
            if (aiSymbol) {
                aiSymbol.rotation.y += 0.02;
            }

            // Animate ambient particles
            particles.forEach(p => {
                p.rotation.y += 0.001;
            });

            renderer.render(scene, camera);
        }

        // Game Logic
        function determineWinner(playerChoice, aiChoice) {
            if (playerChoice === aiChoice) return 'draw';

            if (
                (playerChoice === 'rock' && aiChoice === 'scissors') ||
                (playerChoice === 'paper' && aiChoice === 'rock') ||
                (playerChoice === 'scissors' && aiChoice === 'paper')
            ) {
                return 'player';
            }

            return 'ai';
        }

        function getSmartAIChoice() {
            const difficulty = gameState.difficulty;
            const random = Math.random() * 100;

            // Below difficulty, AI plays randomly
            if (random > difficulty) {
                return getRandomChoice();
            }

            // Smart AI based on player history
            if (gameState.playerHistory.length < 2) {
                return getRandomChoice();
            }

            // Pattern detection - counter the most common player move
            const recentHistory = gameState.playerHistory.slice(-5);
            const counts = { rock: 0, paper: 0, scissors: 0 };

            recentHistory.forEach(choice => {
                counts[choice]++;
            });

            let predictedPlayerMove = Object.keys(counts).reduce((a, b) =>
                counts[a] > counts[b] ? a : b
            );

            // Counter the predicted move
            return counterMove(predictedPlayerMove);
        }

        function counterMove(move) {
            const counters = {
                rock: 'paper',
                paper: 'scissors',
                scissors: 'rock'
            };
            return counters[move];
        }

        function getRandomChoice() {
            const choices = ['rock', 'paper', 'scissors'];
            return choices[Math.floor(Math.random() * choices.length)];
        }

        function showAIDialogue(type) {
            const existingDialogue = document.getElementById('ai-dialogue');
            if (existingDialogue) {
                existingDialogue.remove();
            }

            const dialogue = document.createElement('div');
            dialogue.id = 'ai-dialogue';
            dialogue.innerHTML = `<div class="ai-text">${getRandomDialogue(type)}</div>`;
            document.getElementById('ui-overlay').appendChild(dialogue);

            setTimeout(() => {
                dialogue.remove();
            }, 3000);
        }

        function getRandomDialogue(type) {
            const dialogues = aiDialogues[type];
            return dialogues[Math.floor(Math.random() * dialogues.length)];
        }

        function playRound(playerChoice) {
            if (gameState.isPlaying) return;

            gameState.isPlaying = true;
            gameState.playerChoice = playerChoice;
            gameState.playerHistory.push(playerChoice);

            // Keep only last 10 moves
            if (gameState.playerHistory.length > 10) {
                gameState.playerHistory.shift();
            }

            // Disable buttons
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.classList.add('disabled');
            });

            // Show countdown
            showCountdown();

            // AI makes choice after delay
            setTimeout(() => {
                gameState.aiChoice = getSmartAIChoice();

                // Create symbols
                createSymbol(playerChoice, new THREE.Vector3(0, 2, 4), true);
                createSymbol(gameState.aiChoice, new THREE.Vector3(0, 2, -4), false);

                // Camera zoom
                animateCamera();

                // Determine winner after animation
                setTimeout(() => {
                    const result = determineWinner(playerChoice, gameState.aiChoice);
                    handleResult(result);
                }, 1500);
            }, 1500);
        }

        function showCountdown() {
            const indicator = document.getElementById('round-indicator');
            const messages = ['3', '2', '1', 'SHOOT!'];
            let index = 0;

            function showNext() {
                if (index < messages.length) {
                    indicator.textContent = messages[index];
                    indicator.style.display = 'block';

                    setTimeout(() => {
                        indicator.style.display = 'none';
                        index++;
                        setTimeout(showNext, 100);
                    }, 400);
                }
            }

            showNext();
        }

        function animateCamera() {
            const startZ = camera.position.z;
            const targetZ = 12;
            const startTime = Date.now();
            const duration = 1000;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                camera.position.z = startZ + (targetZ - startZ) * progress;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Zoom back
                    setTimeout(() => {
                        const backStart = Date.now();
                        function zoomBack() {
                            const elapsed = Date.now() - backStart;
                            const progress = Math.min(elapsed / duration, 1);

                            camera.position.z = targetZ + (startZ - targetZ) * progress;

                            if (progress < 1) {
                                requestAnimationFrame(zoomBack);
                            }
                        }
                        zoomBack();
                    }, 500);
                }
            }

            animate();
        }

        function handleResult(result) {
            const resultDisplay = document.getElementById('result-display');

            let message = '';
            let className = '';
            let dialogueType = '';
            let particleColor = 0xffffff;

            if (result === 'player') {
                message = '🎉 YOU WIN! 🎉';
                className = 'result-win';
                dialogueType = 'lose';
                gameState.playerScore++;
                particleColor = 0x00ff00;

                // Change AI color to show defeat
                aiCharacter.material.color.setHex(0xff0000);
                aiCharacter.material.emissive.setHex(0xff0000);

                createWinParticles(new THREE.Vector3(0, 2, 4), particleColor);
            } else if (result === 'ai') {
                message = '😢 AI WINS! 😢';
                className = 'result-lose';
                dialogueType = 'win';
                gameState.aiScore++;
                particleColor = 0xff0000;

                // Change AI color to show victory
                aiCharacter.material.color.setHex(0x00ff00);
                aiCharacter.material.emissive.setHex(0x00ff00);

                createWinParticles(new THREE.Vector3(0, 2, -4), particleColor);
            } else {
                message = '🤝 DRAW! 🤝';
                className = 'result-draw';
                dialogueType = 'draw';
                gameState.drawScore++;
                particleColor = 0xffff00;

                createWinParticles(new THREE.Vector3(0, 2, 0), particleColor);
            }

            resultDisplay.textContent = message;
            resultDisplay.className = className;
            resultDisplay.style.display = 'block';

            // Show AI dialogue
            showAIDialogue(dialogueType);

            // Update score
            updateScore();

            // Reset for next round
            setTimeout(() => {
                resultDisplay.style.display = 'none';
                gameState.isPlaying = false;

                // Reset AI color
                aiCharacter.material.color.setHex(0xff00ff);
                aiCharacter.material.emissive.setHex(0xff00ff);

                // Enable buttons
                document.querySelectorAll('.choice-btn').forEach(btn => {
                    btn.classList.remove('disabled');
                });

                // Show taunt
                showAIDialogue('taunt');

                // Remove symbols
                if (playerSymbol) {
                    scene.remove(playerSymbol);
                    playerSymbol = null;
                }
                if (aiSymbol) {
                    scene.remove(aiSymbol);
                    aiSymbol = null;
                }
            }, 3000);
        }

        function updateScore() {
            document.getElementById('player-score').textContent = gameState.playerScore;
            document.getElementById('ai-score').textContent = gameState.aiScore;
            document.getElementById('draw-score').textContent = gameState.drawScore;
        }

        // UI Event Listeners
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            showAIDialogue('taunt');
        });

        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const choice = btn.getAttribute('data-choice');
                playRound(choice);
            });
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (gameState.isPlaying) return;
            if (document.getElementById('start-screen').style.display !== 'none') return;

            switch(e.key) {
                case '1':
                    playRound('rock');
                    break;
                case '2':
                    playRound('paper');
                    break;
                case '3':
                    playRound('scissors');
                    break;
            }
        });

        // Difficulty slider
        const difficultySlider = document.getElementById('difficulty-slider');
        const difficultyLabel = document.getElementById('difficulty-label');

        difficultySlider.addEventListener('input', (e) => {
            gameState.difficulty = parseInt(e.target.value);

            let label = 'Easy';
            if (gameState.difficulty > 60) {
                label = 'Expert';
            } else if (gameState.difficulty > 30) {
                label = 'Hard';
            }

            difficultyLabel.textContent = label;
        });

        // Initialize
        initThreeJS();
        animate();
    </script>
</body>
</html>
